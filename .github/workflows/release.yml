---
name: Release

# Releases main when a push changes something that's built. A change only to the docs or agent settings starts no run.
# Its commits are still counted in the next release, as they're since the latest tag. CI's changes job skips the build
# of a pull request for the same paths: change both together.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/dependabot.yml"
      - ".vscode/**"
      - "Docs/**"
      - "LICENSE"

permissions:
  contents: read

# A run waits for the one in progress, and a newer push replaces a run that's still waiting, so two releases never
# race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same build and tests as on a pull request, so a push straight to main is checked too, and a failed check
  # releases nothing. It also works out the version and whether a release is due.
  # GitHub checks a called workflow's permissions before the run starts, even for a job that's skipped, so this allows
  # what CI's code review asks for. The review only runs on a pull request, so it's skipped here, and CI's build job
  # still only gets contents: read. No secrets are passed.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write

  # The only job that can write to the repository, so it runs no repository code: it has no checkout. A release is only
  # a vX.Y.Z tag on the commit the run came from, with no GitHub release and no packages: users clone the tag and build
  # the app from source.
  release:
    name: Tag the release
    needs: ci
    if: needs.ci.outputs.release-due == 'true'
    runs-on: ubuntu-26.04
    # actions: read to find the newest run of this workflow.
    permissions:
      actions: read
      contents: write
    steps:
      # A newer run releases this commit's changes too, so only the newest run releases. That also stops a re-run of an
      # older run tagging an older commit.
      - name: Check this is the newest run
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" != "$GITHUB_RUN_ID" ]; then
            echo "::notice title=Release::Run $newest is newer, so it makes the release instead."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          else
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

      # An annotated tag, so it records who made it and when. The API makes the tag object first, then the ref that
      # points to it. Creating the ref fails if the tag already exists, so a release is never moved.
      - name: Create the tag
        if: steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.ci.outputs.version }}
        run: |
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Release $TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          echo "::notice title=Release::Tagged $GITHUB_SHA as $TAG."
