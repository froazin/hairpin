---
name: Release

# Releases main when a push changes something that's built. A change only to the docs or agent settings starts no run.
# Its commits are still counted in the next release, as they're since the latest tag. CI's changes job skips the build
# of a pull request for the same paths: change both together.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/dependabot.yml"
      - ".vscode/**"
      - "Docs/**"
      - "LICENSE"

permissions:
  contents: read

# A run waits for the one in progress, and a newer push replaces a run that's still waiting, so two releases never
# race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same build and tests as on a pull request, so a push straight to main is checked too, and a failed check
  # releases nothing. It also builds the packages this workflow publishes and works out their version.
  # GitHub checks a called workflow's permissions before the run starts, even for a job that's skipped, so this allows
  # what CI's code review asks for. The review only runs on a pull request, so it's skipped here, and CI's build job
  # still only gets contents: read. No secrets are passed.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write

  # The only job that can write to the repository, so it runs no repository code: it has no checkout, and only publishes
  # the packages the CI build made, after checking their hashes. gh release create tags the commit the run came from.
  release:
    name: Release
    needs: ci
    if: needs.ci.outputs.release-due == 'true'
    runs-on: ubuntu-26.04
    # actions: read to find the newest run of this workflow. id-token and attestations to attest the packages' build
    # provenance, which GitHub offers for public repositories.
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      # A newer run releases this commit's changes too, so only the newest run releases. That also stops a re-run of an
      # older run tagging an older commit.
      - name: Check this is the newest run
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" != "$GITHUB_RUN_ID" ]; then
            echo "::notice title=Release::Run $newest is newer, so it makes the release instead."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          else
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the packages
        if: steps.newest.outputs.newest == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - name: Check the hashes
        if: steps.newest.outputs.newest == 'true'
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Attest the build provenance
        if: steps.newest.outputs.newest == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      # The packages aren't signed yet: the release says so, and SHA256SUMS.txt lets users check what they downloaded.
      # Each runtime has a zip that needs .NET installed and a self-contained one, so the notes say which is which.
      - name: Create the release
        if: steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.ci.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          printf '%s\n' \
            '> [!IMPORTANT]' \
            '> These builds are not code-signed. Check each zip against `SHA256SUMS.txt` before you run it.' \
            '' \
            'Each architecture has two zips:' \
            '' \
            '- `WSLProxyRelay-<version>-<runtime>.zip` (recommended) needs the .NET 10 Desktop Runtime for the same' \
            '  architecture, which Microsoft Update keeps patched: `winget install Microsoft.DotNet.DesktopRuntime.10`.' \
            '- `WSLProxyRelay-<version>-<runtime>-self-contained.zip` carries its own copy of .NET, which only a new' \
            '  release patches. Use it where the runtime can'"'"'t be installed.' > "$notes"
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$notes" --generate-notes
